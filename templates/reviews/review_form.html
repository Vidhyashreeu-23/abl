{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card cc-auth-card p-4 p-md-5">
            {% if review %}
                <h2>Edit Review</h2>
            {% else %}
                <h2>Add Review for {{ club.name }}</h2>
            {% endif %}
            <form method="post">{% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Save Review</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
